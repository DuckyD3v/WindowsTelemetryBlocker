name: Safety & Accuracy Check

on:
  push:
    branches: [ 🌕Nextgen ]
  pull_request:
    branches: [ 🌕Nextgen ]

jobs:
  safety:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3

    - name: Check for Dangerous Commands
      shell: pwsh
      run: |
        $dangerous = @('Remove-Item', 'Format-Volume', 'Remove-Partition', 'Clear-Disk', 'Set-Partition', 'Remove-Item -Recurse -Force', 'del /f /q /s', 'rd /s /q', 'shutdown', 'Stop-Computer', 'Restart-Computer')
        $scripts = Get-ChildItem -Path . -Filter *.ps1 -Recurse
        foreach ($script in $scripts) {
          $content = Get-Content $script.FullName -Raw
          foreach ($cmd in $dangerous) {
            if ($cmd -eq 'Remove-Item') {
              if ($content -match '\bRemove-Item\b' -and $content -notmatch 'Remove-ItemProperty') {
                throw "Potentially dangerous command '$cmd' found in $($script.FullName)"
              }
            } else {
              if ($content -match "\b$([regex]::Escape($cmd))\b") {
                throw "Potentially dangerous command '$cmd' found in $($script.FullName)"
              }
            }
          }
        }

    - name: Check for Confirm Impact
      shell: pwsh
      run: |
        $scripts = Get-ChildItem -Path . -Filter *.ps1 -Recurse
        foreach ($script in $scripts) {
          $content = Get-Content $script.FullName -Raw
          if ($content -match 'ConfirmImpact') {
            Write-Host "[INFO] ConfirmImpact found in $($script.FullName)"
          }
        }


    - name: Check for Restore Point Creation
      shell: pwsh
      run: |
        $main = Get-Content rls-script.ps1 -Raw
        if ($main -notmatch 'Checkpoint-Computer') {
          throw "Restore point creation (Checkpoint-Computer) missing in main script!"
        }


    - name: Check for Dry-Run Mode
      shell: pwsh
      run: |
        $main = Get-Content rls-script.ps1 -Raw
        if ($main -notmatch 'dryrun') {
          throw "Dry-run mode not found in main script!"
        }


    - name: Check for Logging
      shell: pwsh
      run: |
        $main = Get-Content rls-script.ps1 -Raw
        if ($main -notmatch 'Write-Log') {
          throw "Logging (Write-Log) not found in main script!"
        }


    - name: Check for User Prompts Before Destructive Actions
      shell: pwsh
      run: |
        $main = Get-Content rls-script.ps1 -Raw
        if ($main -notmatch 'Read-Host') {
          Write-Host "[WARNING] No user prompt (Read-Host) found in main script. Ensure destructive actions are confirmed."
        }

    - name: Check for Rollback Scripts
      shell: pwsh
      run: |
        $modules = @('services','telemetry','apps','misc')
        foreach ($mod in $modules) {
          $rollback = "modules/${mod}-rollback.ps1"
          if (-not (Test-Path $rollback)) {
            throw "Missing rollback script: $rollback"
          }
        }

    - name: Check README for Safety Warnings
      shell: pwsh
      run: |
        $readme = Get-Content README.md -Raw
        if ($readme -notmatch 'Test on a VM' -and $readme -notmatch 'Always run as administrator') {
          throw "README.md missing safety warning!"
        }

    - name: Print Success
      shell: pwsh
      run: |
        Write-Host "All safety and accuracy checks passed!"
